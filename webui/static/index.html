<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #0d1b2a, #1b2838);
    padding: 16px 24px;
    border-bottom: 1px solid #1a3a5c;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    background: linear-gradient(90deg, #00d4ff, #007bff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header span { color: #666; font-size: 13px; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .user {
    align-self: flex-end;
    background: #0055aa;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .jarvis {
    align-self: flex-start;
    background: #1a1a2e;
    border: 1px solid #2a2a4e;
    border-bottom-left-radius: 4px;
    color: #c8d6e5;
  }
  .jarvis strong { color: #00d4ff; }
  .time {
    font-size: 11px;
    color: #555;
    margin-top: 4px;
  }
  .typing {
    align-self: flex-start;
    color: #666;
    font-style: italic;
    padding: 8px 16px;
  }
  #input-area {
    padding: 16px 24px;
    border-top: 1px solid #1a3a5c;
    background: #0d1117;
    display: flex;
    gap: 8px;
  }
  #input {
    flex: 1;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px 16px;
    color: #e0e0e0;
    font-size: 15px;
    outline: none;
  }
  #input:focus { border-color: #0055aa; }
  #send {
    background: #0055aa;
    border: none;
    border-radius: 8px;
    color: #fff;
    padding: 12px 24px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #send:hover { background: #0077dd; }
  #send:disabled { background: #333; cursor: not-allowed; }
  .clear-btn {
    background: none;
    border: 1px solid #333;
    color: #666;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .clear-btn:hover { border-color: #555; color: #999; }
  .error { color: #ff4444; }
</style>
</head>
<body>
<header>
  <div>
    <h1>J.A.R.V.I.S</h1>
    <span>Asistente personal</span>
  </div>
  <button class="clear-btn" onclick="limpiarHistorial()">Limpiar</button>
</header>
<div id="chat">
  <div class="msg jarvis"><strong>JARVIS</strong> — Sistemas en línea, señor. ¿En qué puedo ayudarle?</div>
</div>
<div id="input-area">
  <input type="text" id="input" placeholder="Escriba su comando, señor..." autofocus>
  <button id="send" onclick="enviar()">Enviar</button>
</div>
<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  input.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });

  async function enviar() {
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;

    addMsg('user', msg);
    const typingEl = addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      typingEl.remove();
      if (data.response) {
        addMsg('jarvis', data.response);
      } else if (data.error) {
        addMsg('jarvis', 'Error: ' + data.error, true);
      }
    } catch (err) {
      typingEl.remove();
      addMsg('jarvis', 'Error de conexión: ' + err.message, true);
    }

    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }

  function addMsg(type, text, isError) {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    if (isError) div.classList.add('error');
    if (type === 'jarvis') {
      div.innerHTML = '<strong>JARVIS</strong> — ' + text;
    } else {
      div.textContent = text;
    }
    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString();
    div.appendChild(time);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg jarvis typing';
    div.textContent = 'JARVIS está pensando...';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function limpiarHistorial() {
    await fetch('/api/limpiar', { method: 'POST' });
    chat.innerHTML = '<div class="msg jarvis"><strong>JARVIS</strong> — Historial limpiado, señor.</div>';
  }

  async function cargarHistorial() {
    try {
      const res = await fetch('/api/historial');
      const data = await res.json();
      chat.innerHTML = '<div class="msg jarvis"><strong>JARVIS</strong> — Sistemas en línea, señor. ¿En qué puedo ayudarle?</div>';
      for (const entry of data) {
        addMsg('user', entry.usuario);
        addMsg('jarvis', entry.jarvis);
      }
      chat.scrollTop = chat.scrollHeight;
    } catch (e) {}
  }

  cargarHistorial();
</script>
</body>
</html>
